[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-api"
version = "0.1.0"
description = "Autonomous AI YouTube Content Factory — API, agents and workflow engine"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.6",
  "uvicorn[standard]>=0.32.1",
  "pydantic[email]>=2.10.3",
  "pydantic-settings>=2.7.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "pyjwt>=2.10.1",
  "cryptography>=44.0.0",
  "httpx>=0.28.1",
  "python-multipart>=0.0.20",
  "redis>=5.2.1",
  "pillow>=11.0.0",
  "python-dateutil>=2.9.0.post0",
  "tzdata>=2024.2",
  "tenacity>=9.0.0",
  "boto3>=1.35.0",
  "google-api-python-client>=2.156.0",
  "google-auth>=2.37.0",
  "google-auth-oauthlib>=1.2.1",
  "arq>=0.26.3",
]

[project.optional-dependencies]
temporal = ["temporalio>=1.8.0"]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "pytest-cov>=6.0.0",
  "respx>=0.22.0",
  "ruff>=0.8.4",
  "mypy>=1.13.0",
  "types-requests",
]

[tool.setuptools.packages.find]
include = ["app*", "factory_*"]

[tool.setuptools.package-data]
app = ["alembic.ini"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
# UP046/UP047: library code keeps the class-based generic form that mypy type-checks.
# ASYNC109: explicit timeout parameters on port adapters are intentional.
ignore = ["B008", "E501", "UP046", "UP047", "ASYNC109"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
