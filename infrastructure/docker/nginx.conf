worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  client_max_body_size 50m;

  # basic hardening
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

  upstream web  { server web:3000; }
  upstream api  { server api:8000; }

  server {
    listen 80;
    server_name _;

    # authenticated logins and other auth endpoints: stricter limit
    location /api/auth/ {
      limit_req zone=api burst=20 nodelay;
      proxy_pass http://web;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # everything else goes through the web app (it proxies /api/* to the API server-side)
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 300s;
    }

    # large media (video downloads) — streamed, not buffered
    location /media/ {
      proxy_pass http://web/api/proxy/files/;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}
